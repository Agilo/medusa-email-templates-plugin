name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set package version from release tag
        id: set_package_version
        working-directory: packages/medusa-email-templates-plugin
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "Publish from a Git tag or GitHub release so the package version is explicit."
            exit 1
          fi

          VERSION=${GITHUB_REF_NAME#v}
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must resolve to a valid semver version, got: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Publishing version: $VERSION"
          npm pkg set version="$VERSION"

          PUBLISH_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            PUBLISH_TAG=beta
          fi
          echo "publish_tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Run type checks
        run: yarn typecheck

      - name: Build package
        run: yarn build

      - name: Publish to npm
        working-directory: packages/medusa-email-templates-plugin
        run: npm publish --provenance --tag "${{ steps.set_package_version.outputs.publish_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
