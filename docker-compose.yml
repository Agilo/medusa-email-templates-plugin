services:
  postgres:
    image: postgres:16
    container_name: medusa-email-templates-plugin-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    container_name: medusa-email-templates-plugin-postgres-test
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_TEST_PORT:-5434}:5432'
    restart: unless-stopped
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: medusa-email-templates-plugin-redis
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${REDIS_PORT:-6380}:6379'
    restart: unless-stopped
    volumes:
      - redis_data:/data

  redis_test:
    image: redis:7
    container_name: medusa-email-templates-plugin-redis-test
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${REDIS_TEST_PORT:-6382}:6379'
    restart: unless-stopped
    volumes:
      - redis_test_data:/data

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  redis_test_data:
